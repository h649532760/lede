name: Build HL7621-S Lean Lede Firmware

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  WORKDIR: lede
  TARGET: ramips
  SUBTARGET: mt7621

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Lean Lede source (ghproxy加速)
        run: |
          git clone --depth=1 --branch master https://ghproxy.com/https://github.com/coolsnowwolf/lede.git ${{ env.WORKDIR }}

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc libxml-parser-perl unzip bzip2 flex bison python3 python3-pip python3-dev python3-setuptools python3-wheel cmake wget file rsync

      - name: Inject DTS & mt7621 device definition
        run: |
          cd ${{ env.WORKDIR }}
          # 拷贝设备mk到image目录
          cp ../custom/mt7621-device-hailin.mk target/linux/ramips/image/
          # 拷贝dts文件到dts目录
          cp ../custom/mt7621_hailin_hl7621-s.dts target/linux/ramips/dts/

      - name: Apply custom config
        run: |
          cd ${{ env.WORKDIR }}
          cp ../custom/hl7621.config .config

      - name: Update & Install feeds
        run: |
          cd ${{ env.WORKDIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Validate target & drivers
        run: |
          cd ${{ env.WORKDIR }}
          make defconfig

      - name: Download sources & toolchain
        run: |
          cd ${{ env.WORKDIR }}
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd ${{ env.WORKDIR }}
          make -j$(nproc)

      - name: Collect firmware artifacts
        run: |
          cd ${{ env.WORKDIR }}
          mkdir -p ../firmware
          # 只复制固件镜像、sha256sums，跳过packages文件夹
          find bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }} -maxdepth 1 -type f -exec cp {} ../firmware/ \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: HL7621-S-Lede-Firmware
          path: firmware/
