name: Build OpenWrt 24.10 for Hailin HL7621-S

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom/**'
      - '.github/workflows/build-hl7621.yml'

env:
  OPENWRT_BRANCH: v24.10.x          # OpenWrt 24.10 维护分支
  DEVICE_PROFILE: hailin_hl7621-s   # 与 mt7621.mk 里 TARGET_DEVICES 的名字一致
  WORKDIR: openwrt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout OpenWrt ${{ env.OPENWRT_BRANCH }}
        run: |
          git clone --depth=1 --branch "$OPENWRT_BRANCH" \
            https://git.openwrt.org/openwrt/openwrt.git "$WORKDIR"
          git -C "$WORKDIR" submodule update --init --depth=1 -f

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            llvm liblua5.1-0-dev

      - name: Inject board files
        run: |
          set -e
          # 1) 设备树 → ramips/dts/（文件名必须 = mt7621_$(DEVICE_PROFILE).dts）
          cp custom/mt7621_hailin_hl7621-s.dts \
             "$WORKDIR"/target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts

          # 2) 设备定义 → 追加进 mt7621.mk
          echo '' >> "$WORKDIR"/target/linux/ramips/image/mt7621.mk
          cat custom/mt7621-device-hailin.mk \
            >> "$WORKDIR"/target/linux/ramips/image/mt7621.mk

          echo "注入完成："
          ls -la "$WORKDIR"/target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts
          tail -n +1 "$WORKDIR"/target/linux/ramips/image/mt7621.mk | tail -20

      - name: Update feeds
        working-directory: ${{ env.WORKDIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: ${{ env.WORKDIR }}
        run: |
          cp ../custom/hl7621.config .config
          make defconfig

      - name: Verify profile and drivers
        working-directory: ${{ env.WORKDIR }}
        run: |
          grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_${DEVICE_PROFILE}=y" .config \
            || { echo "!! 设备 profile 未生效，检查 mt7621.mk 注入"; exit 1; }
          grep -q 'CONFIG_PACKAGE_kmod-ath9k=y' .config \
            || { echo "!! kmod-ath9k 未选中，WiFi 驱动将缺失"; exit 1; }
          grep -q 'CONFIG_PACKAGE_kmod-usb3=y' .config \
            || { echo "!! kmod-usb3 未选中，USB3/xhci-mtk 将缺失"; exit 1; }
          echo "profile 与驱动配置 OK"

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: |
          make -j$(nproc) download tools
          make -j$(nproc) -i target/compile || make -j$(nproc) V=s
        timeout-minutes: 330

      - name: Collect artifacts
        run: |
          mkdir -p out
          find "$WORKDIR"/bin/targets -type f \( -name '*hailin*' -o -name 'sha256sums' \) \
            -exec cp {} out/ \;
          cp "$WORKDIR"/.config out/hl7621-final.config
          ls -la out/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hl7621-s-openwrt-24.10
          path: out/
          if-no-files-found: error
