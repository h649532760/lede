name: Build OpenWrt 24.10 for Hailin HL7621-S
on:
  workflow_dispatch:
  push:
    paths:
      - 'custom/**'
      - '.github/workflows/build-hl7621.yml'

env:
  OPENWRT_BRANCH: v24.10.x
  DEVICE_PROFILE: hailin_hl7621-s
  WORKDIR: openwrt
  CACHE_KEY: openwrt-dl-${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch OpenWrt source ${{ env.OPENWRT_BRANCH }}
        run: |
          git clone --depth=1 --branch "$OPENWRT_BRANCH" https://git.openwrt.org/openwrt/openwrt.git "$WORKDIR"
          git -C "$WORKDIR" submodule update --init --depth=1 -f

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            llvm liblua5.1-0-dev

      - name: Cache dl download directory
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKDIR }}/dl
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            openwrt-dl-

      - name: Inject DTS & mt7621 device definition
        run: |
          set -e
          cp custom/mt7621_hailin_hl7621-s.dts \
            "$WORKDIR"/target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts

          echo "" >> "$WORKDIR"/target/linux/ramips/image/mt7621.mk
          cat custom/mt7621-device-hailin.mk >> "$WORKDIR"/target/linux/ramips/image/mt7621.mk

          echo "===== Injected DTS ====="
          ls -la "$WORKDIR"/target/linux/ramips/dts/mt7621_hailin_hl7621-s.dts
          echo "===== Tail of mt7621.mk ====="
          tail -30 "$WORKDIR"/target/linux/ramips/image/mt7621.mk

      - name: Update & Install feeds
        working-directory: ${{ env.WORKDIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        working-directory: ${{ env.WORKDIR }}
        run: |
          cp ../custom/hl7621.config .config
          make defconfig

      - name: Validate target & drivers
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_${DEVICE_PROFILE}=y" .config || {
            echo "ERROR: Device profile ${DEVICE_PROFILE} NOT found in .config"
            exit 1
          }
          grep -q 'CONFIG_PACKAGE_kmod-ath9k=y' .config || {
            echo "ERROR: kmod-ath9k missing (AR9382 WiFi)"
            exit 1
          }
          grep -q 'CONFIG_PACKAGE_kmod-usb3=y' .config || {
            echo "ERROR: kmod-usb3 missing (MT7621 xhci)"
            exit 1
          }
          grep -q 'CONFIG_PACKAGE_kmod-mmc-mtk=y' .config || {
            echo "ERROR: kmod-mmc-mtk missing (TF card)"
            exit 1
          }
          echo "✅ Config validation passed"

      - name: Download sources & toolchain
        working-directory: ${{ env.WORKDIR }}
        run: |
          make -j$(nproc) download

      - name: Build firmware
        working-directory: ${{ env.WORKDIR }}
        run: |
          make -j$(nproc) V=s
        timeout-minutes: 300

      - name: Collect firmware artifacts
        run: |
          mkdir -p out
          find "$WORKDIR"/bin/targets -type f \( -name '*hailin*' -o -name 'sha256sums' \) -exec cp {} out/ \;
          cp "$WORKDIR"/.config out/hl7621-final.config
          ls -la out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hl7621-s-openwrt-24.10
          path: out/
          if-no-files-found: error
